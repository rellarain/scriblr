<title>Scriblr</title>
<style>
  html, body { margin: 0; }
  svg { display: block; width: 960px; height: 288px; max-width: none; }
  .ground { fill: var(--surface-base); }
  .slab { fill: var(--surface-deeper); }
  .board { fill: var(--ov-sink-3); }
  .series { fill: var(--surface-deep); }
  .acc { fill: var(--accent); } .acc2 { fill: var(--accent2); } .dk { fill: var(--ov-sink-2); } .lt { fill: var(--level-wash-hi); }
  .f30{fill:var(--level-fill-30)} .f150{fill:var(--level-fill-150)} .f210{fill:var(--level-fill-210)} .f330{fill:var(--level-fill-330)} .f60{fill:var(--level-fill-60)} .f270{fill:var(--level-fill-270)} .f0{fill:var(--level-fill-0)} .f180{fill:var(--level-fill-180)} .f120{fill:var(--level-fill-120)} .f300{fill:var(--level-fill-300)}

<svg viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scriblr">
  <!--
    Blocks: level-fill hues 30 150 210 330 60 270 0 180 120 as spines 24 to 64 wide (spacing multiples of 8) and 150 to 208 tall, on a surface-deeper slab with a board a step darker than it (ov-sink-3, the shelf's black board).
    Series dividers: two series sections (the shelf's .wrShelfSeries, drawn as surface-deep, one step lighter than the slab so they show) each group three spines, with 8px of padding inside; both are the same height and taller than every spine (28px from the top of the slab to the board); the other spines stand loose, 8px clear of a section.
    Title blocks: where a spine's title would run, each spine carries a block (a vertical strip, a few with a small band or label): some in the accent or the admin accent, the rest a darkening (ov-sink-2) or a lightening (level-wash-hi) of the spine's own colour. No text.
    Arrangement: one slab right of x=480, spines standing on its board with 4px gaps, heights and widths unequal; the name bottom-left on the ground.
    Pattern: books on a shelf, the app's own spine motif (Shelf); chosen because the Outline is a book you can see, and the spines are the one place every level colour shows at once.
    Steps and radii: widths, heights and padding are spacing multiples (8), the slab is 24px from the edges, every corner is square (radius-none).
  -->
  <rect class="ground" width="960" height="288"/>
  <rect class="slab" x="480" y="24" width="440" height="240"/>
  <rect class="series" x="488" y="28" width="128" height="212"/>
