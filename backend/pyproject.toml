[project]
name = "scriblr-backend"
version = "0.1.0"
description = "Offline-first local backend for the Scriblr writing app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.26,<1.0",
    "pyinstaller>=6.3,<7.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-xdist>=3.5,<4.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Only what finds real bugs (syntax errors, undefined names, unused imports and variables); style is left alone.
[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
