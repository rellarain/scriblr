[project]
name = "scriblr-backend"
version = "0.1.0"
description = "Offline-first local backend for the Scriblr writing app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.26,<1.0",
    "pyinstaller>=6.3,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
