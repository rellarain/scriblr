name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new advisories appear against dependencies that have not changed.
    - cron: '0 6 * * 1'

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # The exact versions the app is built and tested with (requirements.lock), then the app itself.
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check app tests server_main.py
      # In parallel (pytest-xdist): about a quarter of the time of a serial run.
      - run: python -m pytest -q -p no:cacheprovider -n auto --cov --cov-report=term

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the design-system freshness test: the generated docs under docs/design-system must be committed up to date
      # (run `npm run design-system` after a change to the Writer's look).
      - run: npm test
      # The production build must work, and its entry chunk stays small (the Reader, the Translator and the article builder are split off).
      - run: npm run build

  # Known vulnerabilities in what ships. Advisory: it reports and does not fail the build, since a fix may not exist yet
  # (the dev tools' own advisories, such as Vite 4's dev server, are not in what ships and are not checked here).
  audit:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm ci
        working-directory: electron
      - run: npm audit --omit=dev --audit-level=high
        working-directory: electron
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.lock --no-deps
